name: 연차관리 프로그램 자동 점검

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 소스 받기
        uses: actions/checkout@v4
      - name: Node.js 준비
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 문법 점검
        run: npm run check
      - name: 기능 점검
        run: npm test
